name: Import Kanto map assets

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/regions/kanto/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download Kanto assets
        run: python scripts/download-kanto-assets.py

      - name: Commit imported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/regions/kanto
          if git diff --cached --quiet; then
            echo "No asset changes detected."
            exit 0
          fi
          git commit -m "Add Kanto region map assets"
          git push
